<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent Kernel README Lockup</title>
  <desc id="desc">A dark README lockup for Agent Kernel showing a local kernel command line visual.</desc>
  <rect width="1040" height="360" rx="34" fill="#050505"/>
  <rect x="1" y="1" width="1038" height="358" rx="34" fill="none" stroke="#1F1F1F"/>

  <g transform="translate(64 58)">
    <rect x="0" y="0" width="104" height="104" rx="14" fill="#050505" stroke="#2A2A2A" stroke-width="3"/>
    <g shape-rendering="crispEdges" transform="translate(23 21) scale(.46)">
      <rect x="0" y="0" width="18" height="18" fill="#F4F4F1"/><rect x="18" y="0" width="18" height="18" fill="#F4F4F1"/><rect x="92" y="0" width="18" height="18" fill="#F4F4F1"/><rect x="110" y="0" width="18" height="18" fill="#F4F4F1"/>
      <rect x="0" y="18" width="18" height="18" fill="#F4F4F1"/><rect x="110" y="18" width="18" height="18" fill="#F4F4F1"/>
      <rect x="0" y="100" width="18" height="18" fill="#F4F4F1"/><rect x="110" y="100" width="18" height="18" fill="#F4F4F1"/>
      <rect x="0" y="118" width="18" height="18" fill="#F4F4F1"/><rect x="18" y="118" width="18" height="18" fill="#F4F4F1"/><rect x="92" y="118" width="18" height="18" fill="#F4F4F1"/><rect x="110" y="118" width="18" height="18" fill="#F4F4F1"/>
      <rect x="36" y="36" width="18" height="18" fill="#A6A6A0"/><rect x="74" y="36" width="18" height="18" fill="#A6A6A0"/><rect x="36" y="82" width="18" height="18" fill="#A6A6A0"/><rect x="74" y="82" width="18" height="18" fill="#A6A6A0"/>
      <rect x="55" y="59" width="18" height="18" fill="#F8F46A"/><rect x="55" y="36" width="18" height="18" fill="#F8F46A"/><rect x="55" y="82" width="18" height="18" fill="#F8F46A"/><rect x="32" y="59" width="18" height="18" fill="#F8F46A"/><rect x="78" y="59" width="18" height="18" fill="#F8F46A"/>
    </g>
  </g>

  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, Liberation Mono, monospace">
    <text x="194" y="100" fill="#F4F4F1" font-size="52" font-weight="600" letter-spacing="-2">Agent <tspan fill="#F8F46A">Kernel</tspan></text>
    <text x="198" y="140" fill="#8E8E88" font-size="20">Local memory and safety for the AI coding agents you already use.</text>

    <g transform="translate(198 188)">
      <rect x="0" y="0" width="650" height="74" rx="12" fill="#0B0B0B" stroke="#242424"/>
      <rect x="0" y="0" width="650" height="32" rx="12" fill="#141414"/>
      <path d="M0 32H650" stroke="#F8F46A" stroke-width="1.5"/>
      <text x="22" y="53" fill="#F8F46A" font-size="17">$</text>
      <text x="44" y="53" fill="#DADAD4" font-size="17">npx agent-kernel autopilot</text>
      <text x="22" y="22" fill="#B7B7B0" font-size="13">compile · safe-link · approve · remember</text>
    </g>
  </g>
</svg>
