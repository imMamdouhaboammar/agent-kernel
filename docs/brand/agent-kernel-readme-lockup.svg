<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent Kernel README Lockup</title>
  <desc id="desc">A centered dark README lockup for Agent Kernel showing a local kernel command line visual.</desc>
  <rect width="1040" height="360" rx="28" fill="#050505"/>
  <rect x="1" y="1" width="1038" height="358" rx="27" fill="none" stroke="#2A2A2A" stroke-width="1.2"/>

  <g transform="translate(472 38)">
