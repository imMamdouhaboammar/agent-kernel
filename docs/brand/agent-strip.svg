<svg xmlns="http://www.w3.org/2000/svg" width="980" height="150" viewBox="0 0 980 150" role="img" aria-labelledby="title desc">
  <title id="title">Agent Kernel supported agent surfaces</title>
  <desc id="desc">Text chips for Claude Code, Codex, Cursor, Gemini CLI, OpenCode, Antigravity, and AGENTS.md.</desc>
