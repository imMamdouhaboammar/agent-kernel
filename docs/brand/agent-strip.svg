  <text x="490" y="34" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#94a3b8" letter-spacing="2">ONE LOCAL KERNEL FOR YOUR AGENT STACK</text>
  <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#e5e7eb">
    <g transform="translate(38 64)">
      <rect width="118" height="48" rx="24" fill="#111827" stroke="#334155"/>
      <circle cx="28" cy="24" r="10" fill="#a78bfa"/>
