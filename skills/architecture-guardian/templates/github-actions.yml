name: Architecture Guardian
on:
  pull_request:
permissions:
  contents: read
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @mamdouh-aboammar/agent-kernel
      - run: agent-kernel architecture policy validate .
      - run: agent-kernel architecture check . --base "${{ github.event.pull_request.base.sha }}" --strict --json
