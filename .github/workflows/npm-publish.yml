name: npm publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Verify trusted-publishing runtime
        run: |
          node --version
          npm --version
          npm_version=$(npm --version)
          node -e "const [major, minor] = process.argv[1].split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)" "$npm_version"

      - name: Install dependencies
        run: npm ci

      - name: Run release gates
        run: npm run verify:release

      - name: Validate tag matches package version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./package.json').version")
          expected="${GITHUB_REF_NAME#v}"
          test "$version" = "$expected" || {
            echo "package.json version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          }

      - name: Package preflight
        run: npm run publish:dry

      - name: Stop after manual dry run
        if: github.event_name == 'workflow_dispatch'
        run: echo 'Manual dispatch completed as a dry run; no package was published.'

      - name: Publish package
        if: github.event_name == 'push'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          set +e
          npm publish --access public
          oidc_status=$?
          set -e

          if test "$oidc_status" -eq 0; then
            echo 'Published with npm trusted publishing.'
            exit 0
          fi

          if test "$(npm view "$package@$version" version 2>/dev/null || true)" = "$version"; then
            echo "$package@$version is already live after the publish attempt."
            exit 0
          fi

          test -n "${NPM_TOKEN:-}" || {
            echo 'Trusted publishing failed and the temporary NPM_TOKEN fallback is unavailable.'
            exit "$oidc_status"
          }

          echo 'Trusted publishing is not configured; using the temporary token fallback.'
          NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --access public --provenance

      - name: Verify published package
        if: github.event_name == 'push'
        run: |
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          for attempt in {1..10}; do
            if test "$(npm view "$package@$version" version 2>/dev/null || true)" = "$version"; then
              echo "$package@$version is live on npm"
              exit 0
            fi
            sleep 15
          done
          echo "$package@$version was not visible after 10 checks"
          exit 1
