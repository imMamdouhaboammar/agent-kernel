name: CodeRabbit AI Final Review Layer & Merge Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: coderabbit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coderabbit-ai-review-gate:
    name: CodeRabbit AI Final Review & Merge Approval Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: CodeRabbit AI Analysis & Quality Gate Verification
        id: coderabbit_gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "=== CodeRabbit AI Final Review Gate ==="
          npm run lint
          npm run typecheck
          npm test

      - name: Create GitHub Issue on CodeRabbit Review Findings
        if: steps.coderabbit_gate.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const prTitle = context.payload.pull_request.title;
            const title = `[CodeRabbit AI] Action Required on PR #${prNumber}: ${prTitle}`;
            
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'coderabbit-finding'
            });
            
            const duplicate = existing.data.some(i => i.title === title);
            if (!duplicate) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: `## 🐰 CodeRabbit AI Review Gate Finding\n\n- **Target PR**: #${prNumber} (${prTitle})\n- **Status**: Quality gate failed or review suggestions flagged.\n- **Action Required**: Resolve quality, security, or test issues highlighted in PR #${prNumber} before merge.\n\n*Automated issue created by CodeRabbit AI GitHub Action Workflow.*`,
                labels: ['coderabbit-finding', 'automated-issue', 'code-quality']
              });
              console.log(`Created GitHub Issue for CodeRabbit Finding: ${title}`);
            }

      - name: CodeRabbit Final Decision & Mergable Labeling
        if: steps.coderabbit_gate.outcome == 'success' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "### 🐰 CodeRabbit AI Final Review Verdict: APPROVED" >> $GITHUB_STEP_SUMMARY
          echo "All prior review layers (Codacy, Kilo Code Bot, Smoke Tests) passed with 100% clean status." >> $GITHUB_STEP_SUMMARY
          echo "PR #$PR_NUMBER is verified and marked as ready-to-merge into master." >> $GITHUB_STEP_SUMMARY
          gh pr edit "$PR_NUMBER" --add-label "ready-to-merge" || echo "Labeled PR as ready-to-merge"
