name: MCP Debug

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  mcp-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated MCP test
        shell: bash
        run: |
          set +e
          node --input-type=module -e "import('./test/mcp.mjs').then(m => m.run()).then(() => console.log('mcp test: OK')).catch(error => { console.error(error.stack || error); process.exit(1); })" > mcp-debug.log 2>&1
          status=$?
          echo "exit_status=$status" >> mcp-debug.log
          exit 0
      - name: Upload debug output
        uses: actions/upload-artifact@v4
        with:
          name: mcp-debug-output
          path: mcp-debug.log
          retention-days: 1
