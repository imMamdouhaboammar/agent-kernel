name: MCP Debug

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  mcp-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - name: Run full smoke suite
        shell: bash
        run: |
          set +e
          npm test > mcp-debug.log 2>&1
          status=$?
          echo "exit_status=$status" >> mcp-debug.log
          exit 0
      - name: Upload debug output
        uses: actions/upload-artifact@v4
        with:
          name: mcp-debug-output
          path: mcp-debug.log
          retention-days: 1
