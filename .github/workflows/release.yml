name: GitHub Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Validate tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          expected="${GITHUB_REF_NAME#v}"
          test "$version" = "$expected" || {
            echo "package.json version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          }

      - name: Verify npm package is live
        run: |
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          for attempt in {1..10}; do
            if test "$(npm view "$package@$version" version 2>/dev/null || true)" = "$version"; then
              exit 0
            fi
            sleep 15
          done
          echo "$package@$version is not live; refusing to create a release"
          exit 1

      - name: Build release assets and checksums
        run: |
          package=$(node -p "require('./package.json').name")
          version="${GITHUB_REF_NAME#v}"
          source_archive="/tmp/agent-kernel-v${version}-source.tar.gz"
          git archive --prefix="agent-kernel-v${version}/" --format=tar.gz -o "$source_archive" "$GITHUB_REF_NAME"
          npm_tarball=$(npm pack "$package@$version" --pack-destination /tmp --silent)
          npm_tarball_path="/tmp/$npm_tarball"
          test -s "$source_archive"
          test -s "$npm_tarball_path"
          (cd /tmp && sha256sum "$(basename "$source_archive")" "$npm_tarball" > SHA256SUMS)
          echo "SOURCE_ARCHIVE=$source_archive" >> "$GITHUB_ENV"
          echo "NPM_TARBALL=$npm_tarball_path" >> "$GITHUB_ENV"
          echo "CHECKSUMS=/tmp/SHA256SUMS" >> "$GITHUB_ENV"

      - name: Create or repair release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$SOURCE_ARCHIVE" "$NPM_TARBALL" "$CHECKSUMS" --clobber
          else
            gh release create "$GITHUB_REF_NAME"               "$SOURCE_ARCHIVE"               "$NPM_TARBALL"               "$CHECKSUMS"               --verify-tag               --title "$GITHUB_REF_NAME"               --generate-notes
          fi
          gh release view "$GITHUB_REF_NAME" --json url,assets
