name: GitHub Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag and version
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          expected="${{ steps.meta.outputs.version }}"
          echo "package.json.version=$version expected=$expected"
          if [ "$version" != "$expected" ]; then
            echo "package.json version does not match release tag"
            exit 1
          fi

      - name: Determine previous tag
        id: baseline
        run: |
          current="${{ steps.meta.outputs.tag }}"
          previous=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | grep -v "^${current}$" | head -n 1 || true)
          if [ -n "$previous" ]; then
            echo "previous_tag=$previous" >> "$GITHUB_OUTPUT"
            echo "baseline=$previous"
          else
            echo "previous_tag=" >> "$GITHUB_OUTPUT"
            echo "baseline=first release"
          fi

      - name: Generate release notes
        id: notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = '${{ steps.meta.outputs.tag }}';
            const version = '${{ steps.meta.outputs.version }}';
            const previousTag = '${{ steps.baseline.outputs.previous_tag }}';

            let structured = '';
            try {
              const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
              const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const versionHeader = changelog.match(new RegExp(`^## \\[[v]?${escaped}\\].*$|^## [v]?${escaped}.*$`, 'm'));
              if (versionHeader) {
                const startIdx = changelog.indexOf(versionHeader[0]);
                const rest = changelog.substring(startIdx + versionHeader[0].length);
                const nextHeader = rest.match(/^## /m);
                const endIdx = nextHeader ? rest.indexOf(nextHeader[0]) : rest.length;
                structured = `${versionHeader[0]}\n${rest.substring(0, endIdx).trim()}`.trim();
              }
            } catch (error) {
              core.warning(`Could not parse CHANGELOG.md: ${error.message}`);
            }

            let autoNotes = '';
            try {
              const args = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag
              };
              if (previousTag) args.previous_tag_name = previousTag;
              const { data: notes } = await github.rest.repos.generateReleaseNotes(args);
              autoNotes = notes.body || '';
            } catch (error) {
              core.warning(`Could not generate GitHub release notes: ${error.message}`);
            }

            const body = [
              structured ? `### Changelog\n\n${structured}` : '',
              autoNotes ? `### Commit summary\n\n${autoNotes}` : ''
            ].filter(Boolean).join('\n\n');

            fs.writeFileSync('/tmp/release-body.md', body || `Release ${tag}.`);
            core.info('Release body written to /tmp/release-body.md');

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: /tmp/release-body.md
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
          generate_release_notes: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build source tarball
        run: |
          version="${{ steps.meta.outputs.version }}"
          archive="agent-kernel-v${version}.tar.gz"
          git archive --prefix="agent-kernel-v${version}/" --format=tar.gz -o "/tmp/${archive}" "${{ steps.meta.outputs.tag }}"
          test -s "/tmp/${archive}" || { echo "tarball missing or empty"; exit 1; }
          ls -la "/tmp/${archive}"

      - name: Attach source tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          archive="/tmp/agent-kernel-v${VERSION}.tar.gz"
          gh release upload "$TAG" "$archive" --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "- \(.name) (\(.size) bytes)"'
