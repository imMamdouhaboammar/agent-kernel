name: Daily README story card

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/readme-story-card.yml"
  schedule:
    - cron: '11 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: readme-story-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    name: Refresh managed story card
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out target repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 20
          persist-credentials: false

      - name: Check out pinned README system
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: imMamdouhaboammar/imMamdouhaboammar
          ref: 53960631b9a5675e7e4851945d63076b10062a7b
          path: .readme-intelligence-source
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x

      - name: Update managed README block
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SUMMARY_MODEL: gpt-5-mini
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          cp README.md /tmp/README.before.md
          node .readme-intelligence-source/readme-system/update-project.mjs
          python3 - <<'PY'
          from pathlib import Path

          start = '<!-- project-story:start -->'
          end = '<!-- project-story:end -->'
          before = Path('/tmp/README.before.md').read_text()
          after = Path('README.md').read_text()

          def outside(text):
              left, remainder = text.split(start, 1)
              _, right = remainder.split(end, 1)
              return left, right

          if outside(before) != outside(after):
              raise SystemExit('README updater changed content outside the managed story block')
          PY

      - name: Commit changed README
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo 'README is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: refresh daily project summary'
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin "HEAD:${{ github.event.repository.default_branch }}"
