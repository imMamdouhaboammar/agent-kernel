name: Identity Debug

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  identity-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run full smoke suite
        shell: bash
        run: |
          set +e
          npm test > identity-debug.log 2>&1
          status=$?
          echo "exit_status=$status" >> identity-debug.log
          exit 0
      - name: Upload debug output
        uses: actions/upload-artifact@v4
        with:
          name: identity-debug-output
          path: identity-debug.log
          retention-days: 1
