name: Identity Debug

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  identity-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated identity test
        shell: bash
        run: |
          set +e
          node --input-type=module -e "import('./test/public-cli-agent-identity.mjs').then(m => m.run()).then(() => console.log('identity test: OK')).catch(error => { console.error(error.stack || error); process.exit(1); })" > identity-debug.log 2>&1
          status=$?
          echo "exit_status=$status" >> identity-debug.log
          exit 0
      - name: Upload debug output
        uses: actions/upload-artifact@v4
        with:
          name: identity-debug-output
          path: identity-debug.log
          retention-days: 1
