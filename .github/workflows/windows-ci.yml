name: Windows CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    name: Windows validation (Node 22)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test
        id: smoke
        shell: pwsh
        continue-on-error: true
        run: |
          npm test 2>&1 | Tee-Object -FilePath windows-smoke.log
          exit $LASTEXITCODE

      - name: Upload failed smoke log
        if: steps.smoke.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-log
          path: windows-smoke.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce smoke result
        if: steps.smoke.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Package dry-run
        run: npm run size
