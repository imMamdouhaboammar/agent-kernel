name: Windows CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    name: Windows validation (Node 22)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Package dry-run
        run: npm run size
