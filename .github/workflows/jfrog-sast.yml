# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# JFrog SAST performs 1st party source code security analysis
# For more information, see
# https://docs.jfrog-applications.jfrog.io/jfrog-security-features/sast

name: "JFrog SAST Scan"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '23 4 * * 6'

env:
  # [Mandatory]
  # JFrog platform URL and access token for
  # a JFrog platform instance with active
  # JFrog Advanced Security subscription
  JF_URL: ${{ secrets.JF_URL }}
  JF_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Check secrets availability
      id: check_secrets
      run: |
        if [ -z "$JF_URL" ] || [ -z "$JF_TOKEN" ]; then
          echo "::warning::JFrog credentials (JF_URL or JF_ACCESS_TOKEN) are missing. Skipping JFrog SAST scan."
          echo "available=false" >> $GITHUB_OUTPUT
        else
          echo "available=true" >> $GITHUB_OUTPUT
        fi

    - name: Install and configure JFrog CLI
      if: steps.check_secrets.outputs.available == 'true'
      run: |
        npm install -g jfrog-cli-v2-jf
        echo "$JF_TOKEN" | jf c add --interactive=false --url="$JF_URL" --access-token-stdin

    - name: Run JFrog SAST
      if: steps.check_secrets.outputs.available == 'true'
      run: |
        jf audit --sast --format=sarif > jfrog_sast.sarif
        if [ ! -s jfrog_sast.sarif ] || ! jq empty jfrog_sast.sarif 2>/dev/null; then
          echo "::error::JFrog SAST produced empty or invalid SARIF output"
          exit 1
        fi

    - name: Upload output to generate autofix
      uses: github/codeql-action/upload-sarif@v3
      if: steps.check_secrets.outputs.available == 'true' && success()
      with:
        sarif_file: jfrog_sast.sarif
