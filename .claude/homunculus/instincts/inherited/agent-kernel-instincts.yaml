# Agent Kernel Workflow Feature Development With Cli Hook Docs Tests

## Action

Follow the feature-development-with-cli-hook-docs-tests workflow:
1. Create CLI entry point for the feature (bin/agent-kernel-<feature>.mjs)
2. Implement hook adapter for the feature (bin/agent-kernel-<feature>-hook.mjs)
3. Document the feature protocol (docs/<FEATURE>_PROTOCOL.md)
4. Document hook usage (docs/hooks/<FEATURE>_HOOK.md)
5. Add example/test data (examples/<feature>-example.json, examples/<feature>-settings.json)
6. Write smoke or integration test (test/<feature>.mjs)
7. Expose new CLI bins in package.json
8. Route new subcommand in main CLI (bin/agent-kernel.mjs)
9. Document feature in AGENTS.md

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: bin/agent-kernel-<feature>.mjs, bin/agent-kernel-<feature>-hook.mjs, docs/<FEATURE>_PROTOCOL.md

